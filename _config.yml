# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # The available themes options are "default", "air", "sunrise", "mint", "dirt" and "contrast"
title                    : "Aveline / 言语治疗师"
title_separator          : "-"
name                     : &name "Aveline"
description              : &description "言语治疗师 | 成人吞咽 & 嗓音康复"
url: "https://aveline-st.github.io"
baseurl: ""
repository: "Aveline2026/aveline-st.github.io"

author:
  # Biographic information
  avatar           : "assets/images/avatar.jpg"
  name             : "Aveline"
  pronouns         : "she/her"
  bio              : "言语语言治疗师，病理与病理生理学硕士。研究兴趣：成人神经源性吞咽障碍、运动性言语障碍、嗓音障碍康复。"
  location         : "上海"
  employer         : "医院言语治疗科"
  uri              :
  email            : "deldarddari457@gmail.com"

  # Academic websites
  academia         :
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?user=PS_CX0AAAAAJ"
  inspire-hep      :
  impactstory      :
  orcid            : "https://orcid.org/yourorcidurl"
  semantic         :
  ssrn             :
  pubmed           : "https://www.ncbi.nlm.nih.gov/pubmed/?term=john+snow"
  researchgate     :
  scopus           :
  zotero           :

  # Repositories and software development
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "academicpages"
  kaggle           :
  stackoverflow    :

  # Social media
  artstation       :
  bluesky          : "bsky.app"
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         :
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :

